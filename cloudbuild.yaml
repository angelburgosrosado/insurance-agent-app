substitutions:
  _REGION: us-east1
  _REPOSITORY: insurance-agent-app
  _SERVICE: insurance-agent-app
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_SERVICE}:${COMMIT_SHA}

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_IMAGE}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --project=${PROJECT_ID}
      - --platform=managed
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
